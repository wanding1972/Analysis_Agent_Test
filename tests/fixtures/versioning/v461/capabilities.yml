  route_priority: 1
- question_ref: 3
  text: 某车型上市以来累计销量及上市后月度走势如何？
  text_source: verified
  domain: D01
  declared_status: PARTIAL
  shapes:
  - S9
  metric_refs:
  - sales_volume
  - sales_volume_since_launch
  output_kind: series
  requires_signoffs:
  - D1_model_identity
  - D2_sales_authority
  - D9_time_window
  - D11_model_name_variant
  - D8_launch_date_proxy
  missing:
  - launch_date
  fallback: 「上市以来」按数据覆盖期内的全部月份统计；上市时间取销量文件的 Model SOP date（D8，口径待签认），上市早于数据起点的车型，更早的销量不在数据内，答案会披露。也可以改问：该车型指定时间段的分月销量。
  fallback_refs:
  - 25
  - 1
  intent: trend
  subject_arity: 1
  channel: C1
  task_intent: query
  task_output_kind: series
  default_metrics:
  - sales_volume
  params:
  - name: $subject
    role: subject_set
    required: true
    on_missing: ASK_USER
    ask: 请指明是哪一款车型（或哪个品牌）。
  route_all:
  - - 上市以来
    - 上市至今
    - 自上市
  route_not:
  - 预测
  - 竞品
  - 相比
  route_priority: 2
