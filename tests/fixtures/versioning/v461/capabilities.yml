  params:
  - name: $time
    role: time_window
    required: true
    on_missing: ASK_USER
    ask: 请指定时间范围，比如「今年」「2025 年」或「最近 12 个月」。
  - name: $n
    role: limit
    required: false
    on_missing: ASK_USER
    ask: 要取前几名？
  route_any:
  - Top
  - top
  - TOP
  - 前几名
  - 排名
  - 销量最高
  - 销量最低
